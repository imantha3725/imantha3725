<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Imantha Sandirigama, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="16"/></clipPath>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d4aff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6d4aff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0b0b10"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <ellipse cx="250" cy="40" rx="380" ry="230" fill="url(#ember)"/>
    <ellipse cx="960" cy="330" rx="400" ry="230" fill="url(#violet)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#24242f"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="58" font-weight="700" letter-spacing="6" fill="#f2f2f5">IMANTHA SANDIRIGAMA</text>
    <text x="600" y="184" font-size="20" fill="#ff8c61">Software Engineer &#8212; full-stack web and applied AI</text>

    <!-- core stack chips -->
    <g font-size="13" fill="#c9c9d1">
      <rect x="454" y="214" width="84" height="32" rx="16" fill="#12121a" stroke="#2c2c3a"/>
      <text x="496" y="235">Laravel</text>
      <rect x="550" y="214" width="74" height="32" rx="16" fill="#12121a" stroke="#2c2c3a"/>
      <text x="587" y="235">React</text>
      <rect x="636" y="214" width="110" height="32" rx="16" fill="#12121a" stroke="#2c2c3a"/>
      <text x="691" y="235">PostgreSQL</text>
    </g>

    <!-- availability -->
    <rect x="525" y="282" width="150" height="32" rx="16" fill="#0f1a14" stroke="#1f4d35"/>
    <circle cx="548" cy="298" r="4" fill="#3ddc84">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="563" y="303" font-size="13" fill="#9be8bd" text-anchor="start">Open to work</text>
  </g>
</svg>
