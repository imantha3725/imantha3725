<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Open to work. Let's build something that holds up. Open to full-time roles and freelance web projects. Email me.">
  <defs>
    <clipPath id="f"><rect x="0" y="0" width="1200" height="200" rx="16"/></clipPath>
    <clipPath id="b"><rect x="930" y="76" width="230" height="48" rx="24"/></clipPath>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1200" height="200" fill="#0d1117"/>
    <ellipse cx="930" cy="100" rx="330" ry="170" fill="url(#g)"><animate attributeName="cx" values="930;1070;930" dur="9s" repeatCount="indefinite"/></ellipse>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="16" fill="none" stroke="#1f2a3a"/>
  <g font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <circle cx="52" cy="46" r="5" fill="#3fb950" opacity="0.6"><animate attributeName="r" values="5;15" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="52" cy="46" r="5" fill="#3fb950"/>
    <text x="68" y="51" font-size="14" fill="#7ee2a0">Open to work</text>
    <text x="40" y="106" font-size="34" font-weight="700" fill="#f2f2f5">Let's build something that holds up.</text>
    <text x="40" y="146" font-size="16" fill="#8b98a9">Full-time roles and freelance web projects. Laravel, React, PostgreSQL, and applied AI.</text>

    <rect x="930" y="76" width="230" height="48" rx="24" fill="#1f6feb"/>
    <g clip-path="url(#b)"><rect x="-90" y="76" width="90" height="48" fill="url(#s)"><animate attributeName="x" values="-90;260;260" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(962,88) scale(1)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3,7 12,13 21,7"/></g>
    <text x="998" y="106" font-size="16" font-weight="600" fill="#ffffff">Email me</text>
  </g>
</svg>
